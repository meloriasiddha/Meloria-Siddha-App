name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Uses the permanent Meloria signing key if it is saved in repo secrets
      # (MELORIA_KEYSTORE_BASE64, MELORIA_KEYSTORE_PASSWORD, MELORIA_KEY_PASSWORD).
      # Without them the build still runs, but the APK can't update an installed app.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MELORIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/meloria-release.jks"
            echo "MELORIA_KEYSTORE_PATH=$RUNNER_TEMP/meloria-release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret – building with temporary debug key."
          fi

      - name: Build APK
        env:
          MELORIA_KEYSTORE_PASSWORD: ${{ secrets.MELORIA_KEYSTORE_PASSWORD }}
          MELORIA_KEY_PASSWORD: ${{ secrets.MELORIA_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build patient app APK
        working-directory: patient_app
        env:
          MELORIA_KEYSTORE_PASSWORD: ${{ secrets.MELORIA_KEYSTORE_PASSWORD }}
          MELORIA_KEY_PASSWORD: ${{ secrets.MELORIA_KEY_PASSWORD }}
        run: flutter pub get && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: meloria-clinic-staff-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meloria-siddha-patient-apk
          path: patient_app/build/app/outputs/flutter-apk/app-release.apk
